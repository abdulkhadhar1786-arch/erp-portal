<div class="min-h-full bg-[#101417] text-white">

  <div
    class="border-b border-white/[0.06] px-6 py-6 lg:px-8">

    <h1 class="text-xl font-semibold">
      Create Ticket
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Create a new customer service ticket
    </p>

  </div>


  <div class="p-6 lg:p-8">

    <div
      class="mx-auto max-w-4xl rounded-2xl border border-white/[0.07] bg-white/[0.025]">


      <!-- Customer / Branch -->

      <div
        class="border-b border-white/[0.06] p-6">

        <h2 class="text-sm font-semibold">
          Customer & Branch
        </h2>

        <div
          class="mt-5 grid grid-cols-1 gap-5 md:grid-cols-2">


          <div>

            <label
              class="mb-2 block text-xs text-slate-400">

              Customer *

            </label>

            <select
              [(ngModel)]="ticket.customerId"
              (ngModelChange)="onCustomerChange()"
              [disabled]="loadingCustomers"
              class="h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-slate-300 outline-none">

              <option value="">
                {{ loadingCustomers ? 'Loading customers...' : 'Select Customer' }}
              </option>

              <option
                *ngFor="let customer of customers"
                [value]="customer._id">

                {{ customer.name }}

              </option>

            </select>

            <p
              *ngIf="submitted && !ticket.customerId"
              class="mt-2 text-xs text-red-400">

              Customer is required.

            </p>

          </div>


          <div>

            <label
              class="mb-2 block text-xs text-slate-400">

              Branch *

            </label>

            <select
              [(ngModel)]="ticket.branchId"
              [disabled]="!ticket.customerId || loadingBranches"
              class="h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-slate-300 outline-none">

              <option value="">
                {{ loadingBranches ? 'Loading branches...' : 'Select Branch' }}
              </option>

              <option
                *ngFor="let branch of filteredBranches"
                [value]="branch._id">

                {{ branch.name }}

              </option>

            </select>

            <p
              *ngIf="submitted && !ticket.branchId"
              class="mt-2 text-xs text-red-400">

              Branch is required.

            </p>

          </div>

        </div>

      </div>


      <div class="border-b border-white/[0.06] p-6">
        <h2 class="text-sm font-semibold">Requester & Asset Details</h2>
        <div class="mt-5 grid grid-cols-1 gap-5 md:grid-cols-2">
          <label class="text-xs text-slate-400">Reported by
            <input [(ngModel)]="ticket.reportedBy" name="reportedBy" maxlength="120" autocomplete="name" class="mt-2 h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-white outline-none">
          </label>
          <label class="text-xs text-slate-400">Contact email
            <input [(ngModel)]="ticket.contactEmail" name="contactEmail" type="email" maxlength="254" autocomplete="email" class="mt-2 h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-white outline-none">
            <span *ngIf="submitted && invalidContactEmail" class="mt-1 block text-red-400">Enter a valid email address.</span>
          </label>
          <label class="text-xs text-slate-400">Contact phone
            <input [(ngModel)]="ticket.contactPhone" name="contactPhone" type="tel" maxlength="40" autocomplete="tel" class="mt-2 h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-white outline-none">
          </label>
          <label class="text-xs text-slate-400">Affected asset / reference
            <input [(ngModel)]="ticket.assetReference" name="assetReference" maxlength="160" placeholder="Device name, asset tag, or reference" class="mt-2 h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-white outline-none">
          </label>
        </div>
      </div>


      <!-- Ticket Information -->

      <div
        class="border-b border-white/[0.06] p-6">

        <h2 class="text-sm font-semibold">
          Ticket Information
        </h2>


        <div class="mt-5 space-y-5">


          <div>

            <label
              class="mb-2 block text-xs text-slate-400">

              Subject *

            </label>

            <input
              maxlength="160"
              type="text"
              [(ngModel)]="ticket.subject"
              placeholder="Enter ticket subject"
              class="h-11 w-full rounded-xl border border-white/[0.08] bg-black/20 px-3 text-sm text-white outline-none placeholder:text-slate-600">

            <p
              *ngIf="submitted && !ticket.subject.trim()"
              class="mt-2 text-xs text-red-400">

              Subject is required.

            </p>

          </div>


          <div
            class="grid grid-cols-1 gap-5 md:grid-cols-2">


            <div>

              <label
                class="mb-2 block text-xs text-slate-400">

                Category *

              </label>

              <select
                [(ngModel)]="ticket.category"
                name="category"
                class="h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-slate-300 outline-none">

                <option value="">
                  Select Category
                </option>

                <option
                  *ngFor="let category of categories"
                  [value]="category">

                  {{ category }}

                </option>

              </select>
              <p *ngIf="submitted && !ticket.category" class="mt-2 text-xs text-red-400">
                Category is required.
              </p>

            </div>


            <div>

              <label
                class="mb-2 block text-xs text-slate-400">

                Priority *

              </label>

              <select
                [(ngModel)]="ticket.priority"
                class="h-11 w-full rounded-xl border border-white/[0.08] bg-[#151a1e] px-3 text-sm text-slate-300 outline-none">

                <option value="Low">
                  Low
                </option>

                <option value="Medium">
                  Medium
                </option>

                <option value="High">
                  High
                </option>

                <option value="Critical">
                  Critical
                </option>

              </select>

            </div>

          </div>


          <div>

            <label
              class="mb-2 block text-xs text-slate-400">

              Description *

            </label>

            <textarea
              [(ngModel)]="ticket.description"
              maxlength="5000"
              rows="7"
              placeholder="Describe the issue..."
              class="w-full rounded-xl border border-white/[0.08] bg-black/20 px-3 py-3 text-sm leading-6 text-white outline-none placeholder:text-slate-600"></textarea>

            <p
              *ngIf="submitted && !ticket.description.trim()"
              class="mt-2 text-xs text-red-400">

              Description is required.

            </p>

          </div>

        </div>

      </div>


      <!-- Error -->

      <div
        *ngIf="errorMessage"
        role="alert"
        class="mx-6 mt-6 rounded-xl border border-red-500/20 bg-red-500/[0.06] p-4 text-sm text-red-300">

        {{ errorMessage }}

      </div>


      <!-- Actions -->

      <div
        class="flex items-center justify-end gap-3 p-6">

        <a
          routerLink="/admin/service/tickets"
          class="rounded-xl border border-white/[0.08] bg-white/[0.03] px-5 py-2.5 text-sm text-slate-400 hover:bg-white/[0.07] hover:text-white">

          Cancel

        </a>


        <button
          type="button"
          (click)="save()"
          [disabled]="saving"
          class="rounded-xl border border-white/[0.10] bg-white/[0.08] px-5 py-2.5 text-sm font-medium text-white hover:bg-white/[0.12] disabled:cursor-not-allowed disabled:opacity-50">

          {{ saving ? 'Creating...' : 'Create Ticket' }}

        </button>

      </div>

    </div>

  </div>

</div>
